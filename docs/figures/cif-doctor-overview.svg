<text x="50" y="84" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="normal" fill="#213443" text-anchor="start">Implemented assessment layer · exact inputs · preserved provenance</text>
<text x="50" y="134" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#214f70" text-anchor="start">NASolve preparation</text>
<text x="690" y="134" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#237466" text-anchor="start">Read-only CIF Doctor audits</text>
