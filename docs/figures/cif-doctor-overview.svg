<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="178.5mm" viewBox="0 0 1200 1190" role="img" aria-labelledby="title description">
<title id="title">CIF Doctor around PostMR and ReadySet</title>
<desc id="description">The existing model-preparation path runs from source dictionaries and an MR model through optional Coot mutation, prepared inputs, ReadySet and effective dictionary selection to existing PostMR gates and refinement. Dashed read-only audit branches inspect mutation sources, frozen source and runtime inputs, and the selected effective bundle. Explicit external linked candidates and native diagnostics check site definitions and selected proxies. Bounded source-declared ring comparisons retain all raw bond differences. Native site IDs and component-list metadata loops preserve reader contracts. Returned Cedar 09 native checks preserve formal-charge and terminal-chemistry review limits. A separate terminal-source review records installed parameters and explicit 5CM preparation before adaptation. JSON receipts preserve findings; no coordinate repair or stitching is performed by this audit layer.</desc>
<rect width="1200" height="1190" fill="white"/>
