name: Build backbone chemistry feature

on:
  push:
    branches: [feature/backbone-chemistry-recipes]
    paths:
      - scripts/apply_backbone_feature.py
      - scripts/fix_backbone_patcher.py
      - scripts/apply_backbone_followup.py
      - .github/workflows/backbone-feature-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/backbone-chemistry-recipes
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply guarded feature patches once
        shell: bash
        run: |
          if grep -q 'backbone_sites: dict\[str, str\]' src/nasolve/automr_input.py; then
            echo 'Primary backbone patch already applied.'
          else
            python scripts/fix_backbone_patcher.py
            python scripts/apply_backbone_feature.py
          fi
          if grep -q 'model: Path, run: Path, reviewed: bool' src/nasolve/backbone.py; then
            echo 'Backbone follow-up already applied.'
          else
            python scripts/apply_backbone_followup.py
          fi
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Verify released NARestraints dependency
        run: python -c "import importlib.metadata as m; assert m.version('NARestraints') == '1.1.2', m.version('NARestraints')"
      - name: Run full tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - name: Static integrity checks
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Commit validated generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'vecchioni-lab'
          git config user.email 'vecchionis@gmail.com'
          git add -- src tests docs README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'Harden backbone review and final inspection prompt' -m 'Validated by the full NASolve pytest suite in GitHub Actions. Makes human-review records portable, rejects internally linked terminal-phosphate requests before cleanup, and offers the Coot/confirmation review flow after successful interactive AutoRefine. Uses the published NARestraints v1.1.2 dependency.'
          git push origin HEAD:feature/backbone-chemistry-recipes
