name: Build backbone chemistry feature

on:
  push:
    branches: [feature/backbone-chemistry-recipes]
    paths:
      - scripts/apply_backbone_feature.py
      - .github/workflows/backbone-feature-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/backbone-chemistry-recipes
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply guarded source patch once
        shell: bash
        run: |
          if grep -q 'backbone_sites: dict\[str, str\]' src/nasolve/automr_input.py; then
            echo 'Backbone patch already applied; validating current branch.'
          else
            python scripts/apply_backbone_feature.py
          fi
      - name: Install test environment
        run: python -m pip install -e '.[test]'
      - name: Run full tests
        run: PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider
      - name: Static integrity checks
        shell: bash
        run: |
          python -m compileall -q src tests
          git diff --check
      - name: Commit validated generated patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'vecchioni-lab'
          git config user.email 'vecchionis@gmail.com'
          git add -- src tests README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'Implement explicit backbone chemistry and review flow' -m 'Validated by the full NASolve pytest suite in GitHub Actions before this commit. Adds complete 5-prime phosphate construction, site-scoped experimental passthrough, persistent review provenance, campaign propagation, and the interactive Coot review gate. DE chemistry remains out of scope.'
          git push origin HEAD:feature/backbone-chemistry-recipes
