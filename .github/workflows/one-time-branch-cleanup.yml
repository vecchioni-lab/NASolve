name: One-time audited branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-time-branch-cleanup.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify preservation and atomically delete only the approved heads
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote
          repo = os.environ['GITHUB_REPOSITORY']
          approved = {
            'vecchioni-lab/NASolve': [
              ('feature/portable-workspaces-autorefine', '443320ace145319b3763c15f4b6976ca25148868', None),
              ('fix/1ap-linked-phosphate', 'af08c5a7be3855b82a6a6fe3311f96c5eaa29bab', None),
            ],
            'vecchioni-lab/NARestraints': [
              ('dictionary-audit', '5e3422f25e1e2572f6f7e85d7a43b94c4485ff15', None),
              ('modified-stacking', 'ff386d017c11a1c897e3013ea13cd35fce2b8445', '1f20e9f15074d15caa9691bd3d55956b50d86837'),
            ],
          }
          if repo not in approved:
              raise SystemExit('Unapproved repository')
          def get(path, absent_ok=False):
              request = Request('https://api.github.com/repos/' + repo + '/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as error:
                  if absent_ok and error.code == 404:
                      return None
                  raise
          main = get('git/ref/heads/main')['object']['sha']
          deletions = []
          for name, expected, squash in approved[repo]:
              ref = get('git/ref/heads/' + quote(name, safe=''), absent_ok=True)
              if ref is None:
                  print('Already absent:', name)
                  continue
              if ref['object']['sha'] != expected:
                  raise SystemExit('Branch changed; refusing deletion: ' + name)
              preserved = squash or expected
              if squash:
                  original_tree = get('git/commits/' + expected)['tree']['sha']
                  merged_tree = get('git/commits/' + squash)['tree']['sha']
                  if original_tree != merged_tree:
                      raise SystemExit('Squash tree mismatch: ' + name)
              comparison = get('compare/' + preserved + '...' + main)
              if comparison['status'] not in ('ahead', 'identical'):
                  raise SystemExit('Branch work is not preserved on main: ' + name)
              print('Preserved on main; approved for deletion:', name, expected)
              deletions.append((name, expected))
          if deletions:
              with tempfile.TemporaryDirectory() as work:
                  subprocess.run(['git', 'init', '-q', work], check=True)
                  command = ['git', '-C', work, '-c', 'credential.helper=', '-c',
                             'credential.helper=!gh auth git-credential', 'push', '--atomic']
                  command += ['--force-with-lease=refs/heads/' + name + ':' + sha for name, sha in deletions]
                  command += ['https://github.com/' + repo + '.git']
                  command += [':refs/heads/' + name for name, _ in deletions]
                  subprocess.run(command, check=True, timeout=90)
          print('Guarded cleanup complete; no worktree files were changed.')
          PY
