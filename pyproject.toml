[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "NASolve"
version = "0.1.0"
description = "Guarded automated structure solution for nucleic-acid crystallography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "NARestraints @ git+https://github.com/vecchioni-lab/NARestraints.git@v1.1.3",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
topology = ["gemmi>=0.7.5,<0.8"]
topology-fit = ["gemmi>=0.7.5,<0.8", "scipy>=1.14,<2"]

[project.scripts]
nasolve = "nasolve.cli:main"
nasolve-topostitch-inspect = "nasolve.topostitch_inspect:main"
nasolve-topostitch-preview = "nasolve.topostitch_preview:main"
nasolve-topostitch-fit = "nasolve.topostitch_fit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nasolve = [
  "data/presets/*.toml",
  "data/sequence_references/*.json",
  "data/ligands/*.cif",
  "data/restraints/*.phil",
  "data/restraints/*.eff",
  "data/restraints/*.txt",
  "data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
