[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "NASolve"
version = "0.2.0"
description = "Guarded automated structure solution for nucleic-acid crystallography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "NARestraints @ https://github.com/vecchioni-lab/NARestraints/releases/latest/download/narestraints.tar.gz",
  "packaging>=21",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
topology = ["gemmi>=0.7.5,<0.8"]

[project.scripts]
nasolve = "nasolve.cli:main"
nasolve-topostitch-inspect = "nasolve.topostitch_inspect:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nasolve = [
  "data/presets/*.toml",
  "data/sequence_references/*.json",
  "data/ligands/*.cif",
  "data/ligands/*.provenance.json",
  "data/chemical_references/*.cif",
  "data/chemical_references/*.json",
  "data/restraints/*.phil",
  "data/restraints/*.eff",
  "data/restraints/*.txt",
  "data/*.json",
  "metal/web/*.html",
  "metal/web/*.css",
  "metal/web/*.mjs",
  "data/replay/*.pdb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
