[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "NASolve"
version = "0.1.0"
description = "Guarded automated structure solution for nucleic-acid crystallography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "NARestraints @ git+https://github.com/vecchioni-lab/NARestraints.git@1f20e9f15074d15caa9691bd3d55956b50d86837",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nasolve = "nasolve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nasolve = [
  "data/presets/*.toml",
  "data/ligands/*.cif",
  "data/restraints/*.phil",
  "data/restraints/*.eff",
  "data/restraints/*.txt",
  "data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
