[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "NASolve"
version = "0.1.0"
description = "Guarded automated structure solution for nucleic-acid crystallography"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "NARestraints @ git+https://github.com/vecchioni-lab/NARestraints.git@v1.1.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nasolve = "nasolve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
